[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-outbound"
version = "0.1.0"
description = "Llamadas salientes a centros médicos con un agente de voz IA de Telnyx"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
voice-outbound = "voice_outbound.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_outbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
